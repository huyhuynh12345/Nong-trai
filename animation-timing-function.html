<!DOCTYPE html>
<html>
<head>
<style> 
.nt {
  width: 100px;
  height: 100px;
  background: red;
  position: relative;
  animation: mymove 5s infinite;
  animation-timing-function: linear;
}
.nt1 {
  width: 100px;
  height: 100px;
  background: rgb(195, 16, 183);
  position: relative;
  animation: mymove 5s infinite;
  animation-timing-function:ease;
}
.nt2 {
  width: 100px;
  height: 100px;
  background: rgb(55, 215, 247);
  position: relative;
  animation: mymove 5s infinite;
  animation-timing-function: ease-in-out;
}
.nt3 {
  width: 100px;
  height: 100px;
  background: rgb(52, 188, 34);
  position: relative;
  animation: mymove 5s infinite;
  animation-timing-function:cubic-bezier(0.165, 0.84, 0.44, 1);
}
@keyframes mymove {
  from {left: 0px;}
  to {left: 200px;}
}
</style>
</head>
<body>

<h1>Nong trai</h1>
<div class="nt"></div>
<div class="nt1"></div>
<div class="nt2"></div>
<div class="nt3"></div>


<div></div>

</body>
</html>
